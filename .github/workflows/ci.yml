
name: CloudOps Platform CI

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Inspect OIDC claims
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import base64

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token_request_url = url + "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              token_request_url,
              headers={
                  "Authorization": (
                      f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
                  )
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.loads(response.read())["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ["iss", "aud", "sub"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::936441715679:role/GitHubActionsCloudOpsDeployRole
          aws-region: eu-central-1

      - name: Verify AWS identity
        if: github.event_name == 'push'
        run: aws sts get-caller-identity
      
      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-071987907d49fe70e" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CloudOps Platform $GITHUB_SHA" \
            --parameters commands="[
              \"docker pull ghcr.io/saba1231234/cloudops-platform:$GITHUB_SHA\",
              \"docker stop cloudops-platform || true\",
              \"docker rm cloudops-platform || true\",
              \"docker run -d --name cloudops-platform --restart unless-stopped -p 80:8000 ghcr.io/saba1231234/cloudops-platform:$GITHUB_SHA\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-071987907d49fe70e"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-071987907d49fe70e" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
